name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full release pipeline
        run: distribute\pipeline.bat
        shell: cmd

      - name: Create GitHub Release
        if: success()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "Camera Calibration $tag"
          try { $notes = Get-Content -Raw distribute\RELEASE_NOTES.md } catch {}
          $files = @()
          if (Test-Path "distribute\cm_calib_dist") { $files += "distribute\cm_calib_dist\*" }
          $archive = Get-Item "distribute\CameraCalibration_*.7z" -ErrorAction SilentlyContinue
          if ($archive) { $files += $archive.FullName }
          if ($files.Count -eq 0) {
            gh release create $tag --title "Camera Calibration $tag" --notes "$notes"
          } else {
            gh release create $tag --title "Camera Calibration $tag" --notes "$notes" $files
          }
